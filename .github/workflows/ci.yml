name: ci

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, so pin an exact release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      # MLX is Apple Silicon only, so CI installs the evaluation and judge extras.
      - run: uv sync --locked --extra eval --extra judge
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action's default (8.24.3) ignores .gitleaks.toml's allowlist;
          # match the version pre-commit runs.
          GITLEAKS_VERSION: 8.30.1
